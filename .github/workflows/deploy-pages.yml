name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build static export
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npm run build

      # The gh-pages branch holds only built files, but Vercel's Git
      # integration builds every pushed branch — and with the project's Root
      # Directory set to "frontend", which does not exist on gh-pages, every
      # push produced a failed Vercel deployment (production was unaffected).
      # A frontend/vercel.json in the published branch tells Vercel to skip it.
      - name: Tell Vercel not to build the gh-pages branch
        run: |
          mkdir -p frontend/out/frontend
          echo '{"git":{"deploymentEnabled":false}}' > frontend/out/frontend/vercel.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/out
